<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PokeTrainer - Pokemon Ranking</title>

    <style>
        :root {
            --bg: #f4f6f9;
            --panel: #ffffff;
            --text: #23303d;
            --muted: #5f6c7b;
            --header: #2c3e50;
            --accent: #ffeaa7;
            --error-bg: #fdecec;
            --error-text: #a12424;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 20px;
            color: var(--text);
        }

        h1 {
            text-align: center;
            color: var(--text);
            margin-bottom: 10px;
        }

        .status {
            width: min(90%, 960px);
            margin: 0 auto 16px;
            padding: 12px 16px;
            border-radius: 10px;
            background: var(--panel);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
            color: var(--muted);
        }

        .status.error {
            background: var(--error-bg);
            color: var(--error-text);
        }

        table {
            width: 90%;
            margin: 20px auto;
            border-collapse: collapse;
            background: var(--panel);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        th, td {
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: var(--header);
            color: white;
        }

        tr:hover {
            background-color: #f1f1f1;
        }

        img {
            width: 60px;
            height: 60px;
            object-fit: contain;
        }

        .top {
            background-color: var(--accent);
            font-weight: bold;
        }

        .empty {
            color: var(--muted);
            font-style: italic;
        }
    </style>
</head>
<body>

<h1>Pokemon Ranking</h1>
<div id="status" class="status">Waiting for Pokemon data...</div>

<table>
    <thead>
        <tr>
            <th>Rank</th>
            <th>Sprite</th>
            <th>Name</th>
            <th>Type</th>
            <th>HP</th>
            <th>Attack</th>
            <th>Defense</th>
            <th>Speed</th>
            <th>Score</th>
        </tr>
    </thead>
    <tbody id="pokemonTable"></tbody>
</table>

<script>
    const apiBaseUrl = window.location.protocol === "file:" ? "http://localhost:8080" : "";
    const statusElement = document.getElementById("status");
    const table = document.getElementById("pokemonTable");

    function setStatus(message, isError = false) {
        statusElement.textContent = message;
        statusElement.classList.toggle("error", isError);
    }

    function renderEmptyState(message) {
        table.innerHTML = `<tr><td class="empty" colspan="9">${message}</td></tr>`;
    }

    async function loadPokemon() {
        setStatus("Loading Pokemon data from the backend...");
        renderEmptyState("Loading Pokemon data...");

        try {
            const response = await fetch(`${apiBaseUrl}/api/pokemon/ranked`);

            if (!response.ok) {
                const errorBody = await response.text();
                throw new Error(`Request failed with ${response.status}. ${errorBody}`);
            }

            const data = await response.json();

            if (!Array.isArray(data) || data.length === 0) {
                setStatus("No Pokemon data is available yet. Start the Spring app and let the import finish.", true);
                renderEmptyState("No Pokemon data returned.");
                return;
            }

            table.innerHTML = "";

            data.forEach((pokemon) => {
                const row = document.createElement("tr");

                if (pokemon.rankPosition <= 10) {
                    row.classList.add("top");
                }

                row.innerHTML = `
                    <td>${pokemon.rankPosition ?? "-"}</td>
                    <td><img src="${pokemon.spriteUrl ?? ""}" alt="${pokemon.name}" /></td>
                    <td>${pokemon.name}</td>
                    <td>${pokemon.primaryType}${pokemon.secondaryType ? " / " + pokemon.secondaryType : ""}</td>
                    <td>${pokemon.hp ?? "-"}</td>
                    <td>${pokemon.attackStat ?? "-"}</td>
                    <td>${pokemon.defenseStat ?? "-"}</td>
                    <td>${pokemon.speedStat ?? "-"}</td>
                    <td>${pokemon.score ?? "-"}</td>
                `;

                table.appendChild(row);
            });

            setStatus(`Loaded ${data.length} ranked Pokemon.`);
        } catch (error) {
            console.error("Error loading Pokemon:", error);
            setStatus("Could not load Pokemon from the backend. Make sure the app is running on http://localhost:8080.", true);
            renderEmptyState("The page could not reach the Pokemon API endpoint.");
        }
    }

    loadPokemon();
</script>

</body>
</html>
