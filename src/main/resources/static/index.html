<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokeTrainer - Pokédex</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        /* =====================================================
           INTRO SCREEN
        ===================================================== */
        #intro-screen {
            position: fixed; inset: 0; z-index: 9999; background: #000;
            display: flex; align-items: center; justify-content: center; overflow: hidden;
        }
        #intro-screen.fade-out { animation: introFadeOut 0.8s forwards; }
        @keyframes introFadeOut { to { opacity: 0; pointer-events: none; } }
        #intro-video { width: 100%; height: 100%; object-fit: contain; display: block; background: #000; }
        #intro-hints {
            position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 24px; pointer-events: none;
        }
        .hint-badge {
            background: rgba(0,0,0,.55); border: 1px solid rgba(255,255,255,.2);
            border-radius: 6px; padding: 6px 12px; color: rgba(255,255,255,.55);
            font-family: 'Press Start 2P', monospace; font-size: 8px;
            letter-spacing: .5px; white-space: nowrap;
        }
        .hint-badge kbd {
            display: inline-block; background: rgba(255,255,255,.12);
            border: 1px solid rgba(255,255,255,.3); border-radius: 3px;
            padding: 1px 5px; margin-right: 4px; font-family: inherit; font-size: 8px;
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg:         #0b0d16;
            --colorA:     #161b28;
            --colorB:     #0f1320;
            --colorC:     #1d2335;
            --colorD:     #222840;
            --colorE:     #2a324a;
            --sel-active: #2e4a6e;
            --sel-hover:  #1e3450;
            --font-color: #dde3f0;
            --text-muted: #5a6a8a;
            --accent-red: #cc2233;
            --pixel:      'Press Start 2P', monospace;
        }
        html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--font-color); font-family: var(--pixel); }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: var(--colorB); }
        ::-webkit-scrollbar-thumb { background: var(--sel-active); border-radius: 2px; }
        #main-content { display: none; flex-direction: column; height: 100vh; width: 100vw; overflow: hidden; }
        /* HEADER */
        #top-header {
            flex-shrink: 0; height: 52px; display: flex; align-items: center;
            padding: 0 16px; gap: 14px;
            background: linear-gradient(180deg, #1c3550 0%, #111826 100%);
            border-bottom: 2px solid var(--colorE);
        }
        #header-pokeball {
            width: 22px; height: 22px; border-radius: 50%; border: 2px solid #fff;
            background: linear-gradient(180deg, #e00 50%, #fff 50%); position: relative; flex-shrink: 0;
        }
        #header-pokeball::after {
            content: ''; position: absolute; width: 7px; height: 7px; border-radius: 50%;
            background: #fff; border: 2px solid #333; top: 50%; left: 50%; transform: translate(-50%,-50%);
        }
        .main-title { font-size: clamp(9px,1.6vw,16px); color: #fff; letter-spacing: 3px; text-shadow: 0 0 14px #4af, 0 0 3px #fff; }
        .gen-badge  { font-size: 7px; background: var(--accent-red); color: #fff; padding: 3px 7px; border: 1px solid rgba(255,255,255,.25); letter-spacing: 1px; }
        #pokemon-count { margin-left: auto; font-size: 7px; color: var(--text-muted); }
        /* SEARCH */
        .search-wrapper {
            flex-shrink: 0; height: 38px; display: flex; align-items: center; gap: 6px;
            padding: 0 10px; background: var(--colorA); border-bottom: 2px solid var(--colorE);
        }
        .search-icon { font-size: 10px; color: var(--text-muted); flex-shrink: 0; }
        #search-bar {
            flex: 1; height: 24px; background: var(--colorB); border: 1px solid var(--sel-active);
            color: var(--font-color); font-family: var(--pixel); font-size: 7px; padding: 0 8px; outline: none; min-width: 0;
        }
        #search-bar::placeholder { color: var(--text-muted); }
        #search-bar:focus { border-color: #5af; box-shadow: 0 0 6px rgba(85,170,255,.3); }
        .search-select {
            height: 24px; background: var(--colorB); border: 1px solid var(--sel-active);
            color: var(--font-color); font-family: var(--pixel); font-size: 6px;
            padding: 0 4px; outline: none; cursor: pointer; flex-shrink: 0;
        }
        /* LAYOUT */
        #non-header { flex: 1; min-height: 0; display: flex; overflow: hidden; }
        /* LIST */
        #pokemon-list {
            width: 290px; min-width: 180px; flex-shrink: 0;
            background: var(--colorA); border-right: 2px solid var(--colorE);
            overflow-y: auto; overflow-x: hidden; display: flex; flex-direction: column;
        }
        .poke-entry {
            display: flex; align-items: center; padding: 6px 10px; gap: 8px;
            cursor: pointer; border-bottom: 1px solid var(--colorE);
            user-select: none; transition: background .08s;
        }
        .poke-entry:hover  { background: var(--sel-hover); }
        .poke-entry.active { background: var(--sel-active); }
        .poke-num   { font-size: 8px; color: var(--text-muted); min-width: 32px; text-align: right; flex-shrink: 0; }
        .poke-list-sprite { width: 42px; height: 42px; object-fit: contain; image-rendering: pixelated; flex-shrink: 0; }
        .poke-list-info { flex: 1; min-width: 0; }
        .poke-list-name { font-size: 8px; color: var(--font-color); text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 5px; }
        .poke-list-types { display: flex; gap: 3px; }
        .type-dot   { width: 9px; height: 9px; border-radius: 1px; display: inline-block; flex-shrink: 0; }
        .poke-rank-num { font-size: 8px; color: var(--text-muted); min-width: 22px; text-align: right; flex-shrink: 0; }
        #list-message { padding: 24px 12px; text-align: center; font-size: 8px; color: var(--text-muted); line-height: 2.4; }
        /* DETAIL */
        #pokemon-detail {
            flex: 1; background: var(--colorB); overflow-y: auto; overflow-x: hidden;
            display: flex; flex-direction: column;
        }
        #detail-placeholder {
            margin: auto; text-align: center; color: var(--text-muted);
            font-size: 8px; line-height: 3; pointer-events: none;
        }
        #detail-placeholder::before { content: '>'; display: block; font-size: 24px; margin-bottom: 10px; opacity: .3; }
        /* HERO TOP */
        #detail-top {
            display: flex; flex-wrap: wrap; align-items: flex-start; gap: 16px;
            padding: 16px; background: var(--colorA); border-bottom: 2px solid var(--colorE); flex-shrink: 0;
        }
        #detail-sprite-wrap {
            width: 112px; height: 112px; flex-shrink: 0; background: var(--colorB);
            border: 2px solid var(--colorE); display: flex; align-items: center;
            justify-content: center; position: relative; overflow: hidden;
        }
        #detail-sprite-wrap::after {
            content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 1;
            background: repeating-linear-gradient(to bottom,transparent 0,transparent 3px,rgba(0,0,0,.08) 3px,rgba(0,0,0,.08) 4px);
        }
        #detail-sprite { width: 96px; height: 96px; object-fit: contain; image-rendering: pixelated; position: relative; z-index: 0; }
        #detail-name-block { flex: 1; min-width: 140px; }
        #detail-number  { font-size: 8px; color: var(--text-muted); margin-bottom: 8px; }
        #detail-name    { font-size: clamp(10px,1.8vw,18px); color: #fff; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 12px; text-shadow: 0 0 10px rgba(100,180,255,.4); }
        #detail-types   { display: flex; flex-wrap: wrap; gap: 6px; }
        .type-badge     { font-size: 6px; padding: 4px 9px; text-transform: uppercase; font-family: var(--pixel); letter-spacing: .5px; }
        #detail-rank-block { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0; }
        .rank-lbl  { font-size: 6px; color: var(--text-muted); }
        .rank-val  { font-size: 16px; color: #ffd700; text-shadow: 0 0 12px rgba(255,215,0,.5); }
        .score-val { font-size: 10px; color: #7ecfff; }
        /* STATS */
        #detail-stats { padding: 16px 20px; border-bottom: 2px solid var(--colorE); flex-shrink: 0; }
        .section-title { font-size: 7px; color: var(--text-muted); letter-spacing: 2px; border-bottom: 1px dashed var(--colorE); padding-bottom: 8px; margin-bottom: 14px; }
        .stat-row  { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
        .stat-lbl  { font-size: 6px; width: 30px; text-align: right; color: var(--text-muted); flex-shrink: 0; }
        .stat-num  { font-size: 7px; width: 28px; text-align: right; color: var(--font-color); flex-shrink: 0; }
        .stat-bar-bg   { flex: 1; height: 10px; background: var(--colorD); border: 1px solid var(--colorE); overflow: hidden; }
        .stat-bar-fill { height: 100%; transition: width .5s ease; min-width: 2px; }
        .s-hp   .stat-bar-fill { background: #ff5959; }
        .s-atk  .stat-bar-fill { background: #f5ac78; }
        .s-def  .stat-bar-fill { background: #fae078; }
        .s-spa  .stat-bar-fill { background: #85ddff; }
        .s-spd  .stat-bar-fill { background: #96d9d6; }
        .s-spe  .stat-bar-fill { background: #fa92b2; }
        .s-bst  .stat-lbl, .s-bst .stat-num { color: #ffd700; }
        .s-bst  .stat-bar-fill { background: linear-gradient(90deg,#ffd700 0%,#ff8800 100%); }
        /* TABS */
        #detail-tabs {
            display: flex; flex-shrink: 0; background: var(--colorA); border-bottom: 2px solid var(--colorE);
        }
        .tab-btn {
            flex: 1; font-size: 7px; font-family: var(--pixel); padding: 10px 4px;
            cursor: pointer; text-align: center; user-select: none; border: none; outline: none;
            background: var(--colorA); color: var(--text-muted);
            border-right: 1px solid var(--colorE); transition: background .1s, color .1s;
        }
        .tab-btn:last-child { border-right: none; }
        .tab-btn:hover  { background: var(--sel-hover); color: var(--font-color); }
        .tab-btn.active { background: var(--sel-active); color: #fff; }
        .tab-panel { display: none; flex: 1; flex-direction: column; }
        .tab-panel.active { display: flex; }
        /* MOVES TAB */
        #tab-moves { overflow-y: auto; }
        .moves-section { border-bottom: 1px solid var(--colorE); }
        .moves-section-title {
            font-size: 7px; color: var(--text-muted); background: var(--colorC);
            padding: 8px 14px; letter-spacing: 1px; border-bottom: 1px solid var(--colorE);
        }
        .move-row    { display: flex; align-items: center; border-bottom: 1px dashed var(--colorE); }
        .move-row:last-child { border-bottom: none; }
        .move-lv {
            font-size: 6px; background: var(--colorD); color: var(--text-muted);
            min-width: 36px; text-align: center; padding: 9px 4px; flex-shrink: 0;
            border-right: 1px solid var(--colorE);
        }
        .move-name { flex: 1; font-size: 7px; padding: 9px 10px; color: var(--font-color); }
        .move-type-badge { font-size: 5px; padding: 3px 5px; text-transform: uppercase; font-family: var(--pixel); flex-shrink: 0; margin-right: 6px; min-width: 50px; text-align: center; }
        .move-power { font-size: 6px; color: #f5ac78; min-width: 32px; text-align: right; padding-right: 8px; flex-shrink: 0; }
        .move-acc   { font-size: 6px; color: #85ddff; min-width: 38px; text-align: right; padding-right: 8px; flex-shrink: 0; }
        .move-class { font-size: 6px; width: 36px; text-align: center; padding-right: 6px; flex-shrink: 0; }
        .class-physical { color: #f5ac78; }
        .class-special  { color: #85ddff; }
        .class-status   { color: #9b9b9b; }
        .moves-header-row {
            display: flex; align-items: center; border-bottom: 1px solid var(--colorE); background: var(--colorB);
        }
        .moves-header-row .move-lv,
        .moves-header-row .move-name,
        .moves-header-row .move-power,
        .moves-header-row .move-acc,
        .moves-header-row .move-class { font-size: 5px; color: var(--text-muted); padding-top: 5px; padding-bottom: 5px; }
        .moves-empty { font-size: 7px; color: var(--text-muted); padding: 14px; text-align: center; }
        #tab-moves-loading { font-size: 7px; color: var(--text-muted); text-align: center; padding: 30px; line-height: 3; }
        /* ABILITIES TAB */
        #tab-abis { overflow-y: auto; padding: 14px; gap: 10px; }
        .abi-block { background: var(--colorC); border: 1px solid var(--colorE); margin-bottom: 10px; }
        .abi-top   { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--colorE); }
        .abi-name  { font-size: 8px; color: #fff; flex: 1; }
        .abi-tag   { font-size: 6px; padding: 3px 8px; border: 1px solid var(--colorE); color: var(--text-muted); flex-shrink: 0; }
        .abi-tag.slot1  { border-color: #5af; color: #5af; }
        .abi-tag.slot2  { border-color: #8f8; color: #8f8; }
        .abi-tag.hidden { border-color: #d0a0ff; color: #d0a0ff; }
        .abi-desc  { font-size: 6px; color: var(--text-muted); padding: 10px 14px; line-height: 2.2; }
        #tab-abis-loading { font-size: 7px; color: var(--text-muted); text-align: center; padding: 30px; line-height: 3; }
        /* MISC TAB */
        #tab-misc { overflow-y: auto; padding: 14px; }
        .misc-row  { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
        .misc-box  { background: var(--colorC); border: 1px solid var(--colorE); padding: 10px 14px; flex: 1; min-width: 100px; }
        .misc-lbl  { font-size: 6px; color: var(--text-muted); margin-bottom: 6px; }
        .misc-val  { font-size: 9px; color: var(--font-color); }
        #flavor-text {
            font-size: 7px; color: var(--font-color); line-height: 2.4; padding: 14px;
            background: var(--colorC); border: 1px solid var(--colorE); margin-bottom: 10px;
        }
        .evo-block { background: var(--colorC); border: 1px solid var(--colorE); padding: 12px 14px; margin-bottom: 10px; }
        .evo-chain-row { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
        .evo-mon {
            display: flex; flex-direction: column; align-items: center; gap: 4px;
            cursor: pointer; padding: 6px 8px;
        }
        .evo-mon:hover { background: var(--sel-hover); }
        .evo-mon img   { width: 52px; height: 52px; object-fit: contain; image-rendering: pixelated; }
        .evo-mon-name  { font-size: 5px; text-transform: uppercase; }
        .evo-arrow  { font-size: 14px; color: var(--text-muted); }
        .evo-method { font-size: 5px; color: var(--text-muted); text-align: center; max-width: 70px; line-height: 1.8; }
        #tab-misc-loading { font-size: 7px; color: var(--text-muted); text-align: center; padding: 30px; line-height: 3; }
        /* TYPE COLORS */
        .normal   { background-color: #aa9;  color: #2c2c27; }
        .fire     { background-color: #f42;  color: #49170e; }
        .water    { background-color: #39f;  color: #0e2031; }
        .electric { background-color: #fc3;  color: #31280b; }
        .grass    { background-color: #7c5;  color: #16330a; }
        .ice      { background-color: #6cf;  color: #143f55; }
        .fighting { background-color: #b54;  color: #361914; }
        .poison   { background-color: #a59;  color: #2b1526; }
        .ground   { background-color: #db5;  color: #302813; }
        .flying   { background-color: #89f;  color: #161a2c; }
        .psychic  { background-color: #f59;  color: #31101d; }
        .bug      { background-color: #ab2;  color: #2a2e09; }
        .rock     { background-color: #ba6;  color: #252215; }
        .ghost    { background-color: #66b;  color: #171729; }
        .dragon   { background-color: #76e;  color: #0f0d1f; }
        .dark     { background-color: #754;  color: #251b15; }
        .steel    { background-color: #aab;  color: #1b1b1f; }
        .fairy    { background-color: #e9e;  color: #201520; }
        @media (max-width: 560px) {
            #pokemon-list { width: 160px; min-width: 120px; }
            .poke-list-sprite { width: 30px; height: 30px; }
            .poke-num { min-width: 22px; font-size: 7px; }
            .poke-list-name { font-size: 7px; }
            .poke-rank-num { font-size: 7px; }
            #detail-sprite-wrap { width: 80px; height: 80px; }
            #detail-sprite { width: 64px; height: 64px; }
            .tab-btn { font-size: 5px; padding: 8px 2px; }
        }
        /* ===== TEAM BUILDER ===== */
        #tb-open-btn {
            font-family: var(--pixel); font-size: 9px; padding: 8px 18px;
            background: #1a3d5c; border: 2px solid #3af; color: #3af;
            cursor: pointer; letter-spacing: 2px; margin-left: 12px; white-space: nowrap;
            text-shadow: 0 0 8px #3af; box-shadow: 0 0 8px rgba(51,170,255,.35);
        }
        #tb-open-btn:hover { background: #1f5280; color: #fff; border-color: #7cf; text-shadow: 0 0 12px #7cf; box-shadow: 0 0 14px rgba(100,200,255,.55); }
        #tb-overlay {
            display: none; position: fixed; inset: 0; z-index: 8000;
            background: rgba(0,0,0,.82); align-items: center; justify-content: center;
        }
        #tb-panel {
            background: var(--colorA); border: 2px solid var(--colorE);
            width: min(1100px, 96vw); height: min(92vh, 920px);
            display: flex; flex-direction: column; overflow: hidden;
        }
        #tb-hd {
            display: flex; align-items: center; padding: 0 16px; height: 46px;
            background: linear-gradient(180deg,#1c3550 0%,#111826 100%);
            border-bottom: 2px solid var(--colorE); flex-shrink: 0; gap: 12px;
        }
        #tb-hd-title { font-size: 9px; color: #fff; letter-spacing: 2px; flex: 1; text-shadow: 0 0 10px #4af; }
        #tb-close-btn { background: none; border: 1px solid var(--colorE); color: var(--text-muted); font-size: 9px; padding: 3px 10px; cursor: pointer; font-family: var(--pixel); }
        #tb-close-btn:hover { color: #fff; border-color: #fff; }
        #tb-body { display: flex; flex: 1; min-height: 0; overflow: hidden; }
        #tb-slots-wrap {
            width: 350px; min-width: 220px; flex-shrink: 0; overflow-y: auto;
            border-right: 2px solid var(--colorE); padding: 10px; display: flex; flex-direction: column; gap: 8px;
        }
        #tb-slots-title { font-size: 7px; color: var(--text-muted); letter-spacing: 2px; padding-bottom: 8px; border-bottom: 1px dashed var(--colorE); flex-shrink: 0; }
        #tb-slots { display: flex; flex-direction: column; gap: 8px; }
        .tb-slot { background: var(--colorC); border: 1px solid var(--colorE); }
        .tb-slot-empty { padding: 12px 8px; text-align: center; font-size: 7px; color: var(--text-muted); cursor: pointer; line-height: 2; letter-spacing: 1px; }
        .tb-slot-empty:hover { background: var(--sel-hover); color: var(--font-color); }
        .tb-slot-header { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-bottom: 1px solid var(--colorE); }
        .tb-slot-sprite { width: 48px; height: 48px; image-rendering: pixelated; object-fit: contain; flex-shrink: 0; }
        .tb-slot-info { flex: 1; min-width: 0; }
        .tb-slot-name { font-size: 7px; color: #fff; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .tb-slot-types { display: flex; gap: 3px; flex-wrap: wrap; }
        .tb-type-badge { font-size: 5px; padding: 2px 6px; font-family: var(--pixel); }
        .tb-slot-rm { background: none; border: 1px solid #443; color: #766; font-size: 9px; padding: 1px 6px; cursor: pointer; font-family: var(--pixel); flex-shrink: 0; line-height: 1; }
        .tb-slot-rm:hover { background: #300; color: #f55; border-color: #f55; }
        .tb-move-list { padding: 5px 8px; display: flex; flex-direction: column; gap: 3px; }
        .tb-move-slot { display: flex; align-items: center; gap: 6px; padding: 5px 8px; background: var(--colorD); border: 1px solid var(--colorE); cursor: pointer; min-height: 28px; }
        .tb-move-slot:hover { background: var(--sel-hover); }
        .tb-move-nm { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 6px; color: var(--text-muted); }
        .tb-move-nm.filled { color: var(--font-color); }
        .tb-move-type-dot { width: 8px; height: 8px; border-radius: 1px; flex-shrink: 0; display: inline-block; }
        .tb-move-type-dot-empty { width: 8px; height: 8px; border-radius: 1px; flex-shrink: 0; display: inline-block; border: 1px dashed var(--colorE); }
        .tb-move-rm { color: #766; cursor: pointer; flex-shrink: 0; font-size: 9px; line-height: 1; }
        .tb-move-rm:hover { color: #f55; }
        #tb-cov-panel { flex: 1; min-width: 0; display: flex; flex-direction: column; overflow: hidden; }
        #tb-cov-tabs { display: flex; border-bottom: 2px solid var(--colorE); flex-shrink: 0; background: var(--colorA); }
        .tb-cov-btn { flex: 1; font-size: 7px; font-family: var(--pixel); padding: 10px 4px; background: var(--colorA); color: var(--text-muted); border: none; cursor: pointer; border-right: 1px solid var(--colorE); }
        .tb-cov-btn:last-child { border-right: none; }
        .tb-cov-btn:hover  { background: var(--sel-hover); color: var(--font-color); }
        .tb-cov-btn.active { background: var(--sel-active); color: #fff; }
        #tb-cov-content { flex: 1; overflow: auto; }
        .tb-cov-table { width: 100%; border-collapse: collapse; }
        .tb-cov-table th, .tb-cov-table td { border: 1px solid var(--colorE); text-align: center; vertical-align: middle; }
        .tb-cov-table th { background: var(--colorC); padding: 4px 2px; font-size: 6px; color: var(--text-muted); }
        .tbc-type-col { width: 56px; }
        .tbc-sum-col  { width: 64px; }
        .tb-cover-spr { width: 36px; height: 36px; image-rendering: pixelated; object-fit: contain; display: block; margin: 0 auto; }
        .tbc-type-td  { padding: 3px; }
        .tb-type-badge-sm { font-size: 5px; padding: 2px 4px; font-family: var(--pixel); display: inline-block; }

        .tbc-ww  { background: rgba(220,30,30,.70);  color: #fff; }
        .tbc-w   { background: rgba(220,100,30,.55); color: #ffd4b0; }
        .tbc-n   { background: transparent; }
        .tbc-r   { background: rgba(50,180,80,.40);  color: #bfb; }

        #tb-picker, #tb-move-picker {
            display: none; position: fixed; inset: 0; z-index: 9001;
            background: rgba(0,0,0,.88); align-items: center; justify-content: center;

        .tb-pk-panel {
            background: var(--colorA); border: 2px solid var(--colorE);
            width: 300px; max-height: 550px; display: flex; flex-direction: column; overflow: hidden;
        }
        .tb-pk-top { display: flex; align-items: center; padding: 8px 12px; gap: 8px; border-bottom: 1px solid var(--colorE); background: var(--colorC); flex-shrink: 0; }
        .tb-pk-title { font-size: 7px; color: var(--font-color); flex: 1; letter-spacing: 1px; }
        .tb-pk-close { background: none; border: none; color: var(--text-muted); font-size: 13px; cursor: pointer; line-height: 1; padding: 0 2px; }
        .tb-pk-close:hover { color: #fff; }
        #tb-picker-search, #tb-move-search { width: 100%; background: var(--colorB); border: none; border-bottom: 1px solid var(--colorE); color: var(--font-color); font-family: var(--pixel); font-size: 7px; padding: 8px 12px; outline: none; flex-shrink: 0; }
        #tb-picker-list, #tb-move-list { flex: 1; overflow-y: auto; }
        .tb-pk-entry { display: flex; align-items: center; gap: 8px; padding: 5px 10px; cursor: pointer; border-bottom: 1px solid var(--colorE); }
        .tb-pk-entry:hover { background: var(--sel-hover); }
        .tb-pk-spr  { width: 36px; height: 36px; image-rendering: pixelated; object-fit: contain; flex-shrink: 0; }
        .tb-pk-name { font-size: 7px; flex: 1; }
        .tb-pk-dot  { width: 9px; height: 9px; border-radius: 1px; display: inline-block; margin-left: 2px; }
        .tb-mv-entry { display: flex; align-items: center; gap: 8px; padding: 7px 12px; cursor: pointer; border-bottom: 1px solid var(--colorE); font-size: 7px; }
        .tb-mv-entry:hover { background: var(--sel-hover); }
        /* ===== TEAM GENERATOR ===== */
        #tb-auto-btn {
            font-family: var(--pixel); font-size: 7px; padding: 6px 12px;
            background: #152e15; border: 2px solid #4d4; color: #4d4;
            cursor: pointer; letter-spacing: 1px; margin-left: 6px; white-space: nowrap;
            text-shadow: 0 0 8px #4d4; box-shadow: 0 0 8px rgba(68,220,68,.25);
        }
        #tb-auto-btn:hover    { background: #1f4a1f; color: #9f9; border-color: #9f9; text-shadow: 0 0 12px #9f9; }
        #tb-auto-btn:disabled { opacity: .38; cursor: not-allowed; box-shadow: none; text-shadow: none; }
        #tb-gen-status { font-size: 6px; color: #7f7; letter-spacing: 1px; animation: tb-blink 1s step-start infinite; }
        @keyframes tb-blink { 50% { opacity: 0; } }
        .tb-auto-moves-btn {
            background: none; border: 1px solid #3a3; color: #4d4;
            font-size: 5px; padding: 2px 5px; cursor: pointer; font-family: var(--pixel); flex-shrink: 0; line-height: 1.4;
        }

        .tb-auto-moves-btn:disabled { opacity: .35; cursor: not-allowed; }
    </style>
</head>
