spring.application.name=poketrainer

# ── Database ──────────────────────────────────────────────────────────────
# Set DB_USERNAME and DB_PASSWORD as environment variables,
# or create src/main/resources/application-local.properties (see README)
spring.datasource.url=jdbc:mysql://localhost:3306/poketrainer_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.jackson.serialization.fail-on-empty-beans=false

server.port=8080
